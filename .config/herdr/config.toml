onboarding = false
# herdr configuration managed by Gentleman.Dots.

[theme]
# Ghostty bright-black selected rows or Kanagawa's warm/yellow label text.
name = "kanagawa"

auto_switch = false
[theme.custom]
panel_bg = "#06080f"
# Match Pi's Gentle theme, with a muted cyan for Herdr chrome.
accent = "#8a8fa3"
green = "#B7CC85"
blue = "#6FA0AF"
red = "#CB7C94"
yellow = "#DEBA87"

[ui]
pane_gaps = false

accent = "#8a8fa3"

agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[keys]
# Match tmux/Zellij-style prefix muscle memory.
prefix = "ctrl + d"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+ctrl+k"
next_agent = "prefix+alt+j"

# Move between spaces (workspaces).
next_workspace = "prefix+ctrl+o"
previous_workspace = "prefix+ctrl+i"

# Jump straight to agent N (1..9) as listed in the sidebar.
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

[ui.toast]
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = false
pane_history = true
kitty_graphics = true
